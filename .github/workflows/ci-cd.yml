name: AurumOne CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [client-management, portfolio-management, advisory-engine]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build shared domain
      run: |
        cd backend/shared/domain
        mvn clean install
    
    - name: Build service
      run: |
        cd backend/services/${{ matrix.service }}
        mvn clean package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install and build
      run: |
        cd frontend
        npm ci
        npm run build
