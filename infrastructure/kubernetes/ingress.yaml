apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aurumone-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: aurumone.local
    http:
      paths:
      - path: /api/v1/clients
        pathType: Prefix
        backend:
          service:
            name: client-management-service
            port:
              number: 8081
      - path: /api/v1/portfolios
        pathType: Prefix
        backend:
          service:
            name: portfolio-management-service
            port:
              number: 8082
      - path: /api/v1/advisory
        pathType: Prefix
        backend:
          service:
            name: advisory-engine-service
            port:
              number: 8083
