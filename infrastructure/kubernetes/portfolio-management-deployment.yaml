apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-management-service
  labels:
    app: portfolio-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-management
  template:
    metadata:
      labels:
        app: portfolio-management
    spec:
      containers:
      - name: portfolio-management
        image: aurumone/portfolio-management:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/aurumone
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-management-service
spec:
  selector:
    app: portfolio-management
  ports:
  - protocol: TCP
    port: 8082
    targetPort: 8082
  type: ClusterIP
