apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-management-service
  labels:
    app: client-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client-management
  template:
    metadata:
      labels:
        app: client-management
    spec:
      containers:
      - name: client-management
        image: aurumone/client-management:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/aurumone
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client-management-service
spec:
  selector:
    app: client-management
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
  type: ClusterIP
